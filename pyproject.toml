[project]
name = "hermes"
version = "0.2.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
# E731: lambdas are used deliberately for tiny local helpers.
# S101: asserts are how tests are written. B008: FastAPI's Body(...) defaults.
ignore = ["E731", "E702", "S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["browser: drives a real Chromium against a live server", "load: realistic campaign sizes"]
